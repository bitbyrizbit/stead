<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEAD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      background: #020617;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
    }
    .header { margin-bottom: 16px; }
    .wordmark { font-size: 20px; font-weight: 700; letter-spacing: -0.05em; }
    .tagline { font-size: 11px; color: #475569; margin-top: 2px; font-family: monospace; }
    .section-label {
      font-size: 10px; color: #475569; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 8px; font-family: monospace;
    }
    .toggle-btn {
      width: 100%; padding: 8px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 16px;
    }
    .presets { display: flex; gap: 6px; margin-bottom: 16px; }
    .preset-btn {
      flex: 1; padding: 6px 0; border-radius: 6px; border: 1px solid #1e293b;
      background: #0f172a; color: #64748b; font-size: 11px; font-weight: 500;
      cursor: pointer; font-family: monospace;
    }
    .preset-btn.active {
      background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.4);
      color: #86efac;
    }
    .footer {
      font-size: 10px; color: #1e293b; font-family: monospace; text-align: center;
    }
    .divider { border: none; border-top: 1px solid #1e293b; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="wordmark">STEAD</div>
    <div class="tagline">Your intent, not your tremor.</div>
  </div>

  <button id="toggle" class="toggle-btn">STEAD: ON</button>

  <div class="section-label">Steadying level</div>
  <div class="presets">
    <button class="preset-btn" data-preset="light">Light</button>
    <button class="preset-btn active" data-preset="medium">Medium</button>
    <button class="preset-btn" data-preset="strong">Strong</button>
  </div>

  <hr class="divider">
  <div class="footer">Works on any website</div>

  <script src="dist/popup.js"></script>
</body>
</html>
